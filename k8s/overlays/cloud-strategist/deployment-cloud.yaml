apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-cloud-strategist
  namespace: trading-bot
  labels:
    app: trading-bot
    component: cloud-strategist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-bot
      component: cloud-strategist
  template:
    metadata:
      labels:
        app: trading-bot
        component: cloud-strategist
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9202"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: trading-bot-sa

      nodeSelector:
        trading-role: "master-ssd"
      
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      
      containers:
      - name: cloud-strategist
        image: trading-cloud:latest
        imagePullPolicy: IfNotPresent
        
        command:
          - "python3"
          - "-m"
          - "src.cloud.strategist_service"
        
        envFrom:
          - configMapRef:
              name: trading-bot-hybrid-config
          - secretRef:
              name: trading-bot-credentials
              optional: true
          - secretRef:
              name: trading-bot-runtime-env
              optional: true
        
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: GPT5_METRICS_PORT
            value: "9202"
        
        ports:
          - name: metrics
            containerPort: 9202
            protocol: TCP
          - name: api
            containerPort: 8002
            protocol: TCP
        
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 512Mi
        
        volumeMounts:
          - name: logs
            mountPath: /var/log/trading-bot
        
        # Health probes are disabled until dedicated /health and /ready endpoints are added.
        
        securityContext:
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
      
      volumes:
        - name: logs
          emptyDir: {}
      
      # Restart policy
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
