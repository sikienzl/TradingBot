apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-market-data-relay
  namespace: trading-bot
  labels:
    app: trading-bot
    component: market-data-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-bot
      component: market-data-relay
  template:
    metadata:
      labels:
        app: trading-bot
        component: market-data-relay
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9203"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: trading-bot-sa
      nodeSelector:
        trading-role: "master-ssd"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: market-data-relay
          image: trading-cloud:latest
          imagePullPolicy: IfNotPresent
          command:
            - "python3"
            - "-m"
            - "src.hybrid.market_data_relay"
          envFrom:
            - configMapRef:
                name: trading-bot-hybrid-config
            - secretRef:
                name: trading-bot-credentials
                optional: true
            - secretRef:
                name: trading-bot-runtime-env
                optional: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HAILO8_LOCAL_TICK_PATH
              value: "/tmp/trading_ticks"
          ports:
            - name: metrics
              containerPort: 9203
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false