apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-dashboard
  namespace: trading-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-dashboard
  template:
    metadata:
      labels:
        app: trading-dashboard
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        trading-role: "master-ssd"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dashboard
          image: trading-dashboard:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: trading-dashboard-credentials
          env:
            - name: DASHBOARD_DB_SCHEMA
              value: trading_analytics
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
