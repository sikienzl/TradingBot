apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: trading-hailo-worker
  namespace: trading-bot
  labels:
    app: trading-bot
    component: hailo-worker
spec:
  selector:
    matchLabels:
      app: trading-bot
      component: hailo-worker
  template:
    metadata:
      labels:
        app: trading-bot
        component: hailo-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9201"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: trading-bot-sa

      # Temporary bootstrap: run on master until node2 image import/SSH trust is configured.
      # Switch back to rasp2-node once worker node image distribution is set up.
      nodeSelector:
        kubernetes.io/hostname: "rasp1-node"

      # Tolerations for taints (if any)
      tolerations:
        - key: hailo-workload
          operator: Equal
          value: "true"
          effect: NoSchedule
      
      containers:
      - name: hailo-worker
        image: trading-hailo:latest
        imagePullPolicy: IfNotPresent
        
        command:
          - "python3"
          - "-m"
          - "src.hailo.edge_filter_service"
        
        envFrom:
          - configMapRef:
              name: trading-bot-hybrid-config
          - secretRef:
              name: trading-bot-credentials
              optional: true
        
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: HAILO_METRICS_PORT
            value: "9201"
        
        ports:
          - name: metrics
            containerPort: 9201
            protocol: TCP
        
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 768Mi
        
        volumeMounts:
          - name: nvme-tick-storage
            mountPath: /mnt/nvme
          - name: models
            mountPath: /models
            readOnly: true
          - name: logs
            mountPath: /var/log/trading-bot
        
        # Health probes are disabled until dedicated /health and /ready endpoints are added.
        
        securityContext:
          readOnlyRootFilesystem: false
          runAsNonRoot: false  # Needed for hardware access
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - SYS_PTRACE  # For Hailo hardware
      
      volumes:
        - name: nvme-tick-storage
          persistentVolumeClaim:
            claimName: nvme-tick-storage
        - name: models
          emptyDir: {}  # In production, use ConfigMap or dedicated volume
        - name: logs
          emptyDir: {}
      
      # Pod disruption budget (keep at least 1 running on edge)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values:
                        - cloud-strategist
                topologyKey: kubernetes.io/hostname
