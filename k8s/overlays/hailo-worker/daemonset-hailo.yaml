apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: trading-hailo-worker
  namespace: trading-bot
  labels:
    app: trading-bot
    component: hailo-worker
spec:
  selector:
    matchLabels:
      app: trading-bot
      component: hailo-worker
  template:
    metadata:
      labels:
        app: trading-bot
        component: hailo-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9201"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: trading-bot-sa

      # Download ONNX model on first pod start (or when PVC is empty).
      initContainers:
        - name: model-downloader
          image: trading-hailo:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /app/scripts/download_onnx_model.py
          envFrom:
            - configMapRef:
                name: trading-bot-hybrid-config
            - secretRef:
                name: trading-bot-credentials
                optional: true
          env:
            - name: HAILO8_MODEL_PATH
              value: /models/hailo_model.hef
          volumeMounts:
            - name: onnx-model-storage
              mountPath: /models

      nodeSelector:
        trading-role: "hailo-worker"

      # Tolerations for taints (if any)
      tolerations:
        - key: hailo-workload
          operator: Equal
          value: "true"
          effect: NoSchedule
      
      containers:
      - name: hailo-worker
        image: trading-hailo:latest
        imagePullPolicy: IfNotPresent
        
        command:
          - "python3"
          - "-m"
          - "src.hailo.edge_filter_service"
        
        envFrom:
          - configMapRef:
              name: trading-bot-hybrid-config
          - secretRef:
              name: trading-bot-credentials
              optional: true
          - secretRef:
              name: trading-bot-runtime-env
              optional: true
        
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: HAILO_METRICS_PORT
            value: "9201"
          - name: PYTHONPATH
            value: "/host_hailo"
          - name: HAILO8_DEVICE_PATH
            value: "/dev/hailo0"
        
        ports:
          - name: grpc
            containerPort: 50051
            protocol: TCP
          - name: metrics
            containerPort: 9201
            protocol: TCP
        
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 768Mi
        
        volumeMounts:
          - name: onnx-model-storage
            mountPath: /models
          - name: nvme-tick-storage
            mountPath: /mnt/nvme
          - name: logs
            mountPath: /var/log/trading-bot
          - name: hailo-device
            mountPath: /dev/hailo0
          - name: host-hailo-platform
            mountPath: /host_hailo/hailo_platform
            readOnly: true
          - name: host-libhailort-soname
            mountPath: /lib/libhailort.so.4.23.0
            readOnly: true
          - name: host-libhailort-link
            mountPath: /lib/libhailort.so
            readOnly: true
        
        # Health probes are disabled until dedicated /health and /ready endpoints are added.
        
        securityContext:
          readOnlyRootFilesystem: false
          runAsNonRoot: false  # Needed for hardware access
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - SYS_PTRACE  # For Hailo hardware
      
      volumes:
        - name: onnx-model-storage
          persistentVolumeClaim:
            claimName: onnx-model-storage
        - name: nvme-tick-storage
          persistentVolumeClaim:
            claimName: nvme-tick-storage
        - name: logs
          emptyDir: {}
        - name: hailo-device
          hostPath:
            path: /dev/hailo0
            type: CharDevice
        - name: host-hailo-platform
          hostPath:
            path: /usr/lib/python3/dist-packages/hailo_platform
            type: Directory
        - name: host-libhailort-soname
          hostPath:
            path: /lib/libhailort.so.4.23.0
            type: File
        - name: host-libhailort-link
          hostPath:
            path: /lib/libhailort.so
            type: File
      
      # Pod disruption budget (keep at least 1 running on edge)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values:
                        - cloud-strategist
                topologyKey: kubernetes.io/hostname
