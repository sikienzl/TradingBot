apiVersion: v1
kind: Service
metadata:
  name: trading-hailo-worker
  namespace: trading-bot
  labels:
    app: trading-bot
    component: hailo-worker
spec:
  type: ClusterIP
  selector:
    app: trading-bot
    component: hailo-worker
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: metrics
      port: 9201
      targetPort: 9201
      protocol: TCP