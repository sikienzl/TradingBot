apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trading-bot

# Inherit everything from the root base
resources:
  - ../../base/namespace.yaml
  - ../../base/service-account.yaml
  - ../../base/configmap-hybrid.yaml

commonLabels:
  environment: production

# Production: full replicas
replicas:
  - name: hailo-worker
    count: 1
  - name: cloud-strategist
    count: 1

# Production resource limits patch
patches:
  - path: resource-limits.yaml

configMapGenerator:
  - name: trading-env-production
    literals:
      - DRY_RUN=false
      - LOG_LEVEL=INFO
      - HAILO8_ANOMALY_THRESHOLD=85
