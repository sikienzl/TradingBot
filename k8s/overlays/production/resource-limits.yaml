apiVersion: apps/v1
kind: Deployment
metadata:
  name: hailo-worker
spec:
  template:
    spec:
      containers:
        - name: hailo-worker
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-strategist
spec:
  template:
    spec:
      containers:
        - name: cloud-strategist
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
