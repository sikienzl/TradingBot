apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - configmap-initdb.yaml
  - service-postgres.yaml
  - statefulset-postgres.yaml

namespace: trading-bot

commonLabels:
  app: trading-bot
  component: postgres-analytics
  tier: data

commonAnnotations:
  node-affinity: master-only