apiVersion: apps/v1
kind: Deployment
metadata:
  name: hailo-worker
spec:
  template:
    spec:
      containers:
        - name: hailo-worker
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-strategist
spec:
  template:
    spec:
      containers:
        - name: cloud-strategist
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
