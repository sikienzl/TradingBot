apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trading-bot-staging

resources:
  - namespace.yaml
  - ../../base/service-account.yaml
  - ../../base/configmap-hybrid.yaml
  - ../hailo-worker/pvc-nvme.yaml
  - ../hailo-worker/pvc-onnx-model.yaml
  - ../hailo-worker/daemonset-hailo.yaml
  - ../hailo-worker/service-hailo.yaml
  - ../cloud-strategist/deployment-cloud.yaml
  - ../cloud-strategist/service.yaml
  - ../market-data-relay/deployment-relay.yaml
  - ../market-data-relay/service-relay.yaml

commonLabels:
  environment: staging

replicas:
  - name: trading-cloud-strategist
    count: 1

patches:
  - path: configmap-patch.yaml
    target:
      version: v1
      kind: ConfigMap
      name: trading-bot-hybrid-config
