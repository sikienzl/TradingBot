---
- name: Validate pinned release and cluster inputs
  ansible.builtin.assert:
    that:
      - k3s_version is match('^v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+$')
      - k3s_installer_url is match('^https://')
      - k3s_installer_sha256 is match('^[a-fA-F0-9]{64}$')
      - "'REPLACE_WITH' not in k3s_server_address"
      - k3s_node_name is defined and k3s_node_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - vault_k3s_token is defined and vault_k3s_token | length >= 32
      - "'REPLACE_WITH' not in vault_k3s_token"
  no_log: true
- name: Install K3s installer prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
- name: Check installed K3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: k3s_installed.rc not in [0, 2, 127]
  check_mode: false
- name: Refuse implicit K3s version changes
  ansible.builtin.assert:
    that:
      - k3s_installed.rc != 0 or k3s_installed.stdout_lines[0].split()[2] == k3s_version or k3s_allow_version_change | bool
    fail_msg: Existing K3s version differs; plan upgrades and explicitly enable k3s_allow_version_change.
- name: Create K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0700"
- name: Configure K3s node
  ansible.builtin.template:
    src: config.yml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart K3s
- name: Download checksum-pinned K3s installer
  ansible.builtin.get_url:
    url: "{{ k3s_installer_url }}"
    dest: /usr/local/src/cluster-starter-k3s-install.sh
    checksum: "sha256:{{ k3s_installer_sha256 }}"
    mode: "0755"
  when: k3s_installed.rc != 0 or k3s_installed.stdout_lines[0].split()[2] != k3s_version
- name: Install the pinned K3s release
  ansible.builtin.command:
    argv:
      - /usr/local/src/cluster-starter-k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "{{ k3s_role }}"
    INSTALL_K3S_SKIP_START: "true"
  when: k3s_installed.rc != 0 or k3s_installed.stdout_lines[0].split()[2] != k3s_version
  notify: Restart K3s
  changed_when: true
- name: Enable and start K3s
  ansible.builtin.service:
    name: "{{ 'k3s' if k3s_role == 'server' else 'k3s-agent' }}"
    enabled: true
    state: started
- name: Apply K3s changes before waiting for readiness
  ansible.builtin.meta: flush_handlers
- name: Wait for server API
  ansible.builtin.wait_for:
    host: "{{ k3s_server_address }}"
    port: 6443
    timeout: 180
