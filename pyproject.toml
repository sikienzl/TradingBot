[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "trading-bot"
version = "0.1.0"
description = "A modular cryptocurrency trading bot"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
  { name = "Trading Bot Developer" },
]
keywords = ["trading", "crypto", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# ---------------------------------------------------------------------------
# Runtime dependencies  (compatible-release bounds, not pinned)
# ---------------------------------------------------------------------------
dependencies = [
    "ccxt>=4.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "TA-Lib>=0.4",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "catboost>=1.2",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "pydantic>=2.7",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "requests>=2.28",
]

# ---------------------------------------------------------------------------
# Optional extras
# ---------------------------------------------------------------------------
[project.optional-dependencies]
# pip install trading-bot[dev]  – Development & testing
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",      # Async test support for WebSocket
    "httpx>=0.27",
    "black>=24.0",               # Code formatting
    "ruff>=0.4",                 # Linting
]
# pip install trading-bot[all]  – Complete installation
all = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
    "trl>=0.8",
    "datasets>=2.18",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "websockets>=12.0",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "hailort>=3.23",
    "kubernetes>=29.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "grpcio>=1.66",
    "einops>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "black>=24.0",
    "ruff>=0.4",
]

[project.scripts]
trading-bot = "src.main:main"

# ---------------------------------------------------------------------------
# Wheel:  packages the src/ directory as the importable "src" namespace
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
src = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/venv/*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

# ---------------------------------------------------------------------------
# For creating binaries with PyOxidizer
# ---------------------------------------------------------------------------
[tool.pyoxidizer]
build_targets = [
    { name = "pyoxidizer", target = "x86_64-unknown-linux-gnu" },
]
