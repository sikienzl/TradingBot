[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "crypto-trading-bot"
dynamic = ["version"]
description = "Modular crypto trading pipeline: CatBoost/LLM ensemble signals, Kraken integration, simulation and live trading."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "Siegfried Kienzle" },
]
keywords = ["trading", "crypto", "catboost", "kraken", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

# ---------------------------------------------------------------------------
# Runtime dependencies  (compatible-release bounds, not pinned)
# ---------------------------------------------------------------------------
dependencies = [
    "ccxt>=4.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "TA-Lib>=0.4",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "catboost>=1.2",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "pydantic>=2.7",
    "uvicorn>=0.29",
]

# ---------------------------------------------------------------------------
# Optional extras
# ---------------------------------------------------------------------------
[project.optional-dependencies]
# pip install crypto-trading-bot[llm]  – LLM inference (predict.py)
llm = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
]
# pip install crypto-trading-bot[train]  – LLM fine-tuning (train_trading_model.py)
train = [
    "trl>=0.8",
    "datasets>=2.18",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
]
# pip install crypto-trading-bot[hybrid]  – Hailo-8 + K3s Hybrid Setup
hybrid = [
    "websockets>=12.0",          # Kraken WebSocket V2 API
    "onnx>=1.16",                # ONNX model export
    "onnxruntime>=1.17",         # ONNX runtime inference
    "hailort>=3.23",             # Hailo Runtime for Hailo-8 acceleration
    "grpcio>=1.66",              # Pi1 -> Pi2 edge transport
    "prometheus-client>=0.20",   # Runtime metrics for Grafana/Prometheus
]
# pip install crypto-trading-bot[k3s]  – Kubernetes integration for K3s deployment
k3s = [
    "kubernetes>=29.0",          # K3s / Kubernetes client
    "prometheus-client>=0.20",   # Prometheus metrics export
    "pyyaml>=6.0",               # YAML manifest handling
    "grpcio>=1.66",              # Inter-pod transport for market data and alerts
]
# pip install crypto-trading-bot[hailo8]  – All Hailo-8 + Time-Series-Transformer
hailo8 = [
    "websockets>=12.0",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "hailort>=3.23",
    "grpcio>=1.66",
    "prometheus-client>=0.20",
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
    "einops>=0.8",               # Efficient tensor operations for transformers
]
# pip install crypto-trading-bot[dev]  – Development & testing
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",      # Async test support for WebSocket
    "httpx>=0.27",
    "black>=24.0",               # Code formatting
    "ruff>=0.4",                 # Linting
]
# pip install crypto-trading-bot[all]  – Complete installation
all = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
    "trl>=0.8",
    "datasets>=2.18",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "websockets>=12.0",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "hailort>=3.23",
    "kubernetes>=29.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "grpcio>=1.66",
    "einops>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "black>=24.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/sikienzl/TradingBot"
Issues     = "https://github.com/sikienzl/TradingBot/issues"

# ---------------------------------------------------------------------------
# Version – derived automatically from the git tag (e.g. v1.0.22 → 1.0.22)
# ---------------------------------------------------------------------------
[tool.hatch.version]
source = "vcs"

# hatch-vcs writes the resolved version to src/_version.py so it is
# available at runtime without a git checkout.
[tool.hatch.build.hooks.vcs]
version-file = "src/_version.py"

# ---------------------------------------------------------------------------
# Wheel:  packages the src/ directory as the importable "src" namespace
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Source distribution: include everything a developer needs
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "scripts/",
    "deploy/",
    "tests/",
    "README.md",
    "LICENSE",
    "requirements.txt",
    "requirements-pi.txt",
    ".env.example",
    ".env.live.example",
    ".env.simulation.example",
]
exclude = [
    "*.csv",
    "*.log",
    "trade_journal.csv",
    "training_data.csv",
    "auto_tune_state*.json",
    "tuning_policy.json",
    ".env",
    "results/",
    "logs/",
    "model/",
    "catboost_info/",
    ".venv/",
    "build/",
    "old_data/",
]

[tool.ruff]
extend-exclude = [
    "scripts/daily_dryrun_review.py",
    "src/data/analysis/export_pnl_metrics.py",
    "src/data/fetcher.py",
    "src/data_preperation.py",
    "src/fastapi_app.py",
    "src/get_data.py",
    "src/hailo/edge_filter_service.py",
    "src/hailo/inference.py",
    "src/hybrid/decision_gate.py",
    "src/hybrid/grpc_bridge.py",
    "src/kraken_websocket_v2.py",
    "src/models/predict.py",
    "src/models/train_timeseries_transformer.py",
    "src/models/train_trading_model_backup.py",
    "src/models/train_trading_model.py",
    "src/predict.py",
    "src/research_signal.py",
    "src/trading_bot.py",
    "src/utils/secret_manager.py",
    "test_config.py",
    "tests/test_fetch_research_signal.py",
    "tests/test_get_account_balance.py",
    "tests/test_hailo_inference.py",
]
