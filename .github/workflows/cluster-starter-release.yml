name: Cluster starter pre-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Starter version (for example v1.0.0 or v1.0.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install controller dependencies
        run: |
          python -m pip install -r cluster-starter/requirements-controller.txt
          ansible-galaxy collection install -r cluster-starter/requirements.yml

      - name: Validate starter without contacting hosts
        working-directory: cluster-starter
        run: |
          python -m unittest discover -s tests -v
          ansible-inventory -i inventory/example/hosts.yml --graph
          ansible-playbook -i inventory/example/hosts.yml playbooks/site.yml --syntax-check
          ansible-lint playbooks/site.yml

      - name: Test release validation tooling
        run: python -m unittest discover -s .github/scripts/tests -v

      - name: Build and verify archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python .github/scripts/cluster_starter_release.py "$VERSION" dist/starter
          cd dist/starter
          sha256sum --check "cluster-starter-${VERSION}.zip.sha256"

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: cluster-starter-package
          path: dist/starter/
          if-no-files-found: error

  publish:
    needs: validate-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cluster-starter-release-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: cluster-starter-package
          path: dist/starter

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          cd dist/starter
          sha256sum --check "cluster-starter-${VERSION}.zip.sha256"
          tag="cluster-starter-${VERSION}"
          # Fail closed on both an existing tag and an API/network error.
          gh api --method POST "repos/${GH_REPO}/git/refs" \
            -f "ref=refs/tags/${tag}" -f "sha=${TARGET_SHA}" > /dev/null
          gh release create "$tag" \
            "cluster-starter-${VERSION}.zip" "cluster-starter-${VERSION}.zip.sha256" \
            --verify-tag --prerelease --title "Cluster starter ${VERSION}" \
            --notes "Validated cluster starter package. Review and configure the example inventory before use."
