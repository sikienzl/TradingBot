global:
  resolve_timeout: 5m

route:
  receiver: trading-private-webhook
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: trading-private-webhook
    webhook_configs:
      - url: http://127.0.0.1:9095/alerts
        send_resolved: true
