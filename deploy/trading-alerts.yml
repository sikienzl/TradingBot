groups:
  - name: trading-bot-alerts
    rules:
      - alert: TradingScorecardNoGo
        expr: trading_scorecard_final_exit_code >= 3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Trading scorecard verdict is NO-GO"
          description: "latest_status reports final_exit_code >= 3 for at least 10 minutes."

      - alert: TradingScorecardHold
        expr: trading_scorecard_final_exit_code == 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Trading scorecard verdict is HOLD"
          description: "latest_status reports HOLD for at least 30 minutes."

      - alert: TradingScorecardMissing
        expr: (time() - trading_scorecard_timestamp_seconds) > 1200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Trading scorecard metrics are stale"
          description: "No fresh textfile metric update for over 20 minutes."

      - alert: TradingLiveModeScorecardGateBlocked
        expr: trading_scorecard_gate_enabled == 1 and trading_scorecard_gate_live_enabled == 1 and trading_scorecard_gate_allowed == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Live trading is configured without a fresh GO scorecard verdict"
          description: "DRY_RUN=false is configured but the scorecard gate refuses: the verdict is missing, stale, HOLD, NO-GO or ERROR. The bot refuses to start; fix the scorecard or return to DRY_RUN=true."

      - alert: TradingLiveModeWithoutScorecardGate
        expr: trading_scorecard_gate_enabled == 0 and trading_scorecard_gate_live_enabled == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Live trading runs with the scorecard gate disabled"
          description: "SCORECARD_GATE_ENABLED=false overrides the GO prerequisite while DRY_RUN=false is configured."

      - alert: TradingPortfolioSnapshotStale
        expr: trading_portfolio_snapshot_age_seconds > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Trading portfolio snapshot is stale"
          description: "The PnL exporter has not parsed a fresh portfolio snapshot from bot.log for over 120 seconds."

      - alert: TradingKillSwitchActive
        expr: trading_kill_switch_active == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Trading kill switch is active"
          description: "Live buys and sells are blocked by the persistent stop marker."

      - alert: TradingHailoServiceUnavailable
        expr: trading_hailo_health_check_enabled == 1 and trading_hailo_service_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Configured Hailo inference service is unavailable"
          description: "The bot should be using its CPU/rules fallback; investigate service and tunnel health."

      - alert: TradingResearchSignalMissing
        expr: trading_research_signal_present == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Timestamped research signal is unavailable"
          description: "The optional research/news input is missing or has no parseable timestamp."

      - alert: TradingResearchSignalStale
        expr: trading_research_signal_age_seconds > 7200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Research signal is stale"
          description: "The latest timestamped research signal is over two hours old."

      - alert: TradingOperationalHealthMetricsMissing
        expr: absent(trading_kill_switch_active)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Trading operational health metrics are missing"
          description: "The periodic operational-health textfile exporter may have stopped."

      - alert: TradingBotLogMissing
        expr: trading_bot_log_present == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Bot log has no parseable timestamps"
          description: "The configured bot log is missing or unreadable, so bot activity cannot be observed."

      - alert: TradingBotLogStale
        expr: trading_bot_log_age_seconds > 900
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Bot process has not logged recently"
          description: "No bot log line for over 15 minutes; the loop logs every CHECK_INTERVAL, so the process is stopped or wedged."

      - alert: TradingJournalStale
        expr: trading_journal_age_seconds > 93600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Trade journal has no new rows for over 26 hours"
          description: "Journal rows only appear on fills, so a quiet market is expected; a stopped collector looks identical unless this alert fires."

      - alert: TradingMarketDataMissing
        expr: trading_market_data_present == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Market recorder output is unavailable"
          description: "TRADING_MARKET_DATA_DIR is configured but tickers.csv/candles_1m.csv are missing or have no parseable timestamp."

      - alert: TradingMarketDataStale
        expr: trading_market_data_age_seconds > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Market recorder output is stale"
          description: "The newest recorded ticker or 1m candle is over 15 minutes old; the recorder should append within seconds."

      - alert: TradingScheduledTaskFailed
        expr: trading_task_last_exit_code != 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Scheduled trading task exited non-zero"
          description: "The {{ $labels.task }} wrapper reported exit code {{ $value }}; the report or review it produces is missing or stale."

      - alert: TradingScheduledTaskMarkerMissing
        expr: trading_task_status_present == 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Scheduled trading task never reported"
          description: "The {{ $labels.task }} status marker is missing or unreadable, so the timer may never have run since the exporter was configured."

      - alert: TradingScheduledTaskStale
        expr: trading_task_last_run_age_seconds > 172800
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Scheduled trading task has not run recently"
          description: "The last {{ $labels.task }} run finished over 48 hours ago; the systemd timer is stopped, masked, or failing to start."

      - alert: TradingTuningCycleApplyBlocked
        expr: trading_task_last_exit_code{task="weekly_tuning"} == 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Weekly tuning cycle refused to change parameters"
          description: "weekly_tuning exited 3: the safety guard found no scorecard verdict evidence, a verdict older than TUNING_MAX_VERDICT_AGE_SECONDS, or a recent NO-GO. results/scorecards/latest_tuning_cycle_summary.json records the reason; the tuning policy and .env are unchanged."

      - alert: TradingDiskSpaceLow
        expr: trading_disk_free_bytes < 1073741824
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Trading volume has less than 1 GiB available"
          description: "Only {{ $value | humanize1024 }}B free on {{ $labels.path }}; the journal, state, and results will fail to be written."

      - alert: TradingDiskUsedPercentHigh
        expr: trading_disk_used_percent > 90
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Trading volume is more than 90% full"
          description: "{{ $labels.path }} has been above 90% used for 30 minutes; plan cleanup or storage before the volume fills."

      - alert: TradingAnalyticsDatabaseUnavailable
        expr: trading_analytics_database_enabled == 1 and trading_analytics_database_up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Analytics PostgreSQL is unreachable"
          description: "ANALYTICS_DB_URL is configured but the size probe fails; the bot journals to CSV and skips PostgreSQL, so analytics dashboards go stale."

      - alert: TradingFillReconciliationMismatch
        expr: trading_fill_reconciliation_mismatches > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Journalled fills do not match the exchange"
          description: "The last fill reconciliation pass found an unmatched order or a quantity/fee difference; the local accounting is wrong. Run scripts/reconcile_fills.py for the per-order detail."

      - alert: TradingFillReconciliationIncomplete
        expr: trading_fill_reconciliation_enabled == 1 and trading_fill_reconciliation_complete == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Fill reconciliation could not verify the journal"
          description: "The last pass was incomplete (missing credentials, unreadable journal, or a failing exchange call), so no journalled live order is verified."

      - alert: TradingFillReconciliationStale
        expr: trading_fill_reconciliation_enabled == 1 and trading_fill_reconciliation_age_seconds > 10800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Fill reconciliation has not run recently"
          description: "The newest reconciliation marker is over three hours old; fill-reconciliation.timer is stopped or the bot has not started."

      - alert: TradingFillReconciliationMarkerMissing
        expr: trading_fill_reconciliation_enabled == 1 and trading_fill_reconciliation_present == 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Fill reconciliation never reported"
          description: "No parseable reconciliation marker on a live deployment, so the journal has never been verified since the exporter was configured."
