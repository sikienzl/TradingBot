global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "trading_pnl_exporter"
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ["localhost:9200"]

  - job_name: "trading_node_exporter"
    static_configs:
      - targets:
          - "localhost:9100"
          - "worker-node:9100"

  - job_name: "trading_hybrid_strategist"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9202"]

  - job_name: "trading_hybrid_market_relay"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9203"]

  - job_name: "hailo_alert_exporter"
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets: ["localhost:9205"]

rule_files:
  - /etc/prometheus/rules/trading-alerts.yml
